name: Build Hesabdari Asan Native v4 Phase 4

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore HesabdariAsan.Native/HesabdariAsan.Native.csproj

      - name: Compile check
        run: dotnet build HesabdariAsan.Native/HesabdariAsan.Native.csproj -c Release --no-restore

      - name: Restore Windows x64 runtime
        run: dotnet restore HesabdariAsan.Native/HesabdariAsan.Native.csproj -r win-x64

      - name: Publish Windows x64 portable
        run: >-
          dotnet publish HesabdariAsan.Native/HesabdariAsan.Native.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "publish/HesabdariAsan.exe")) { throw "HesabdariAsan.exe was not produced" }
          Get-Item "publish/HesabdariAsan.exe" | Format-List Name,Length,LastWriteTime

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }

      - name: Build Setup.exe
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\HesabdariAsan.iss"'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdari-Asan-v4-Phase4-Setup
          path: installer-output/Hesabdari-Asan-v4-Setup.exe
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdari-Asan-v4-Phase4-Portable
          path: publish/**
          if-no-files-found: error
