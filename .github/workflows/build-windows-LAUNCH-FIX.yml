name: Build Hesabdari Asan Native v4 Launch Fix

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore HesabdariAsan.Native/HesabdariAsan.Native.csproj

      - name: Compile check
        run: dotnet build HesabdariAsan.Native/HesabdariAsan.Native.csproj -c Release --no-restore

      - name: Restore Windows x64 runtime
        run: dotnet restore HesabdariAsan.Native/HesabdariAsan.Native.csproj -r win-x64

      - name: Publish Windows x64 self-contained
        run: >-
          dotnet publish HesabdariAsan.Native/HesabdariAsan.Native.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "publish/HesabdariAsan.exe")) { throw "HesabdariAsan.exe was not produced" }
          Get-Item "publish/HesabdariAsan.exe" | Format-List Name,Length,LastWriteTime

      - name: Startup smoke test
        shell: pwsh
        run: |
          $env:HESABDARI_SMOKE_TEST = "1"
          $p = Start-Process -FilePath "$PWD\publish\HesabdariAsan.exe" -PassThru
          if (-not $p.WaitForExit(15000)) {
            try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw "Startup smoke test timed out."
          }
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $env:APPDATA "HesabdariAsan\Logs\startup.log"
            if (Test-Path $log) { Get-Content $log }
            throw "Startup smoke test failed with exit code $($p.ExitCode)."
          }
          Write-Host "Native startup smoke test passed."

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }

      - name: Build Setup.exe
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\HesabdariAsan.iss"'

      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdari-Asan-v4-Startup-Logs
          path: C:\Users\runneradmin\AppData\Roaming\HesabdariAsan\Logs\**
          if-no-files-found: ignore

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdari-Asan-v4-LaunchFix-Setup
          path: installer-output/Hesabdari-Asan-v4-Setup.exe
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdari-Asan-v4-LaunchFix-Portable
          path: publish/**
          if-no-files-found: error
