name: Build Hesabdari Asan Native v4 Final

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PROJECT: HesabdariAsan.Native/HesabdariAsan.Native.csproj
  EXE_NAME: HesabdariAsan.exe
  SETUP_PATH: installer-output/Hesabdari-Asan-v4-Setup.exe

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore project
        run: dotnet restore $env:PROJECT

      - name: Compile check
        run: dotnet build $env:PROJECT -c Release --no-restore

      - name: Restore Windows x64 runtime
        run: dotnet restore $env:PROJECT -r win-x64

      - name: Publish Windows x64 self-contained
        run: >-
          dotnet publish $env:PROJECT
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish

      - name: Verify published files
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "publish\$env:EXE_NAME"
          if (!(Test-Path $exe)) { throw "$env:EXE_NAME was not produced" }
          Write-Host "Published executable: $exe"
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-ChildItem publish -File | Sort-Object Name | Select-Object Name,Length | Format-Table -AutoSize

      - name: Published app startup smoke test
        shell: pwsh
        run: |
          $env:HESABDARI_SMOKE_TEST = "1"
          $exe = Join-Path $PWD "publish\$env:EXE_NAME"
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(20000)) {
            try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw "Published application startup smoke test timed out."
          }
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $env:APPDATA "HesabdariAsan\Logs\startup.log"
            if (Test-Path $log) { Get-Content $log }
            throw "Published application startup smoke test failed with exit code $($p.ExitCode)."
          }
          Write-Host "Published application startup smoke test passed."
          Remove-Item Env:HESABDARI_SMOKE_TEST -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc /?

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer\HesabdariAsan.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
          if (!(Test-Path $env:SETUP_PATH)) { throw "Setup.exe was not produced at $env:SETUP_PATH" }
          Get-Item $env:SETUP_PATH | Format-List Name,Length,LastWriteTime

      - name: Installed Setup startup smoke test
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "HesabdariAsan-Installed"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          $setup = Join-Path $PWD $env:SETUP_PATH
          $args = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installDir"
          )
          $installer = Start-Process -FilePath $setup -ArgumentList $args -PassThru -Wait
          if ($installer.ExitCode -ne 0) {
            throw "Silent installer test failed with exit code $($installer.ExitCode)."
          }

          $installedExe = Join-Path $installDir $env:EXE_NAME
          if (!(Test-Path $installedExe)) {
            throw "Installed executable not found: $installedExe"
          }

          $env:HESABDARI_SMOKE_TEST = "1"
          $p = Start-Process -FilePath $installedExe -WorkingDirectory $installDir -PassThru
          if (-not $p.WaitForExit(20000)) {
            try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
            throw "Installed application startup smoke test timed out."
          }
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $env:APPDATA "HesabdariAsan\Logs\startup.log"
            if (Test-Path $log) { Get-Content $log }
            throw "Installed application startup smoke test failed with exit code $($p.ExitCode)."
          }
          Write-Host "Installed Setup startup smoke test passed."
          Remove-Item Env:HESABDARI_SMOKE_TEST -ErrorAction SilentlyContinue

      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path workflow-artifacts | Out-Null

          $logDir = Join-Path $env:APPDATA "HesabdariAsan\Logs"
          if (Test-Path $logDir) {
            Copy-Item $logDir "workflow-artifacts\startup-logs" -Recurse -Force
          }

          if (Test-Path publish) {
            Get-ChildItem publish -Recurse -File |
              Select-Object FullName,Length,LastWriteTime |
              Out-File "workflow-artifacts\publish-files.txt" -Encoding utf8
          }

          "Runner: $env:RUNNER_OS" | Out-File "workflow-artifacts\environment.txt" -Encoding utf8
          "Dotnet:" | Out-File "workflow-artifacts\environment.txt" -Append -Encoding utf8
          dotnet --info | Out-File "workflow-artifacts\environment.txt" -Append -Encoding utf8

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdari-Asan-v4-Diagnostics
          path: workflow-artifacts/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdari-Asan-v4-Final-Setup
          path: installer-output/Hesabdari-Asan-v4-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Hesabdari-Asan-v4-Final-Portable
          path: publish/**
          if-no-files-found: error
          retention-days: 30
